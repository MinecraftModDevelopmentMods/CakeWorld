def verifyMavenizerCompatibilityFixture = tasks.register(
        'verifyMavenizerCompatibilityFixture') {
    group = 'verification'
    description = 'Verifies the checksum-sealed Forge 1.18 Mavenizer compatibility tool.'
    inputs.file mavenizerCompatibilityJar
    doLast {
        File fixture = mavenizerCompatibilityJar.asFile
        if (!fixture.isFile()) {
            throw new GradleException(
                    "Missing Mavenizer compatibility fixture: ${fixture}")
        }
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        fixture.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read >= 0;
                    read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        String actual = digest.digest().encodeHex().toString().toUpperCase()
        if (actual != mavenizerCompatibilitySha256) {
            throw new GradleException(
                    "Mavenizer compatibility fixture checksum mismatch: ${actual}")
        }
    }
}

