                gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('override.workspace.settings', 'true')
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated CakeWorld Buildship configuration.')
        }
    }
}

def syncForge40EclipseLaunches = tasks.register(
        'syncForge40EclipseLaunches') {
    group = 'ide'
    description = 'Normalizes ForgeGradle 7 Eclipse launches for Forge 40.'
    doLast {
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String productionModClasses = "${mod_id}%%${mainOutput}"
        ['Client', 'Server', 'GameTestServer', 'Data'].each { runName ->
            File launch = file("run${runName}.launch")
            if (!launch.isFile()) {
                throw new GradleException(
                        "Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8').replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${productionModClasses}\"/>"))
            if (!text.contains(
                    'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n'
                                + '</launchConfiguration>')
            }
            launch.setText(text.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.configureEach {
    finalizedBy syncForge40EclipseLaunches
}

def isolateEclipseProductionRuns = tasks.register(
        'isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Prepares the ForgeGradle 7 Eclipse project configuration.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn syncForge40EclipseLaunches
    dependsOn configureEclipseBuildship
    dependsOn prepareEclipseResources
}

def verifyEclipseProductionClasspath = tasks.register(
        'verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Rejects stale resources, local paths, and test leakage in Eclipse launches.'
    dependsOn isolateEclipseProductionRuns
    dependsOn tasks.named('eclipseClasspath')
    doLast {
        File classpathFile = file('.classpath')
        if (!classpathFile.isFile()) {
            throw new GradleException('Missing generated Eclipse .classpath')
        }
        String classpathText = classpathFile.getText('UTF-8')
        if (!classpathText.contains('path="build/resources/main"')
                || classpathText.contains('path="src/main/resources"')
                || classpathText.contains('path="src/generated/resources"')
                || !classpathText.contains('kind="output" path="bin/default"')) {
            throw new GradleException(
                    'Eclipse must use disjoint outputs and processed production resources')
        }

        File preferencesFile = file(
                '.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        preferencesFile.withInputStream { preferences.load(it) }
        String expectedGradleHome = gradle.gradleUserHomeDir.canonicalPath
        if (preferences.getProperty('connection.gradle.user.home')
                    != expectedGradleHome
                || preferences.getProperty('gradle.user.home')
                    != expectedGradleHome
                || preferences.getProperty('override.workspace.settings')
                    != 'true') {
            throw new GradleException(
                    "Eclipse Buildship is not pinned to ${expectedGradleHome}")
        }

        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String expectedModClasses = "${mod_id}%%${mainOutput}"
        List<String> forbidden = [
                'src/test', 'bin/test', 'build/classes/java/test',
                'com.mcmoddev.cakeworld', 'agent-notes', '.codex',
                'C:\\Users\\John', 'D:\\CakeWorld\\agent-notes'
        ]
        ['Client', 'Server', 'GameTestServer', 'Data'].each { runName ->
            File launch = file("run${runName}.launch")
            String text = launch.getText('UTF-8')
            List<String> leaked = forbidden.findAll { text.contains(it) }
            if (!leaked.isEmpty()
                    || !text.contains(
                            "key=\"MOD_CLASSES\" value=\"${expectedModClasses}\"")
                    || !text.contains(
                            'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')
                    || !text.contains('PROJECT_ATTR" value="CakeWorld"')) {
                throw new GradleException(
                        "Eclipse launch is not isolated: ${launch}; leaked=${leaked}")
            }
        }

        File modMetadata = file('bin/main/META-INF/mods.toml')
        File provider = file(
                'bin/main/data/cakeworld/orespawn/provider.json')
        File oldNamespace = file('bin/main/com/mcmoddev/cakeworld')
        if (!modMetadata.isFile() || !provider.isFile()
                || modMetadata.getText('UTF-8').contains('${mod_version}')
                || !modMetadata.getText('UTF-8').contains(
                        "version=\"${project.version}\"")
                || file('bin/main/META-INF/cakeworld/docs/AGENTS.md').exists()
                || oldNamespace.exists()) {
            throw new GradleException(
                    'Eclipse output contains missing, unexpanded, or agent-only resources')
        }
    }
}

tasks.named('eclipse').configure {
    dependsOn isolateEclipseProductionRuns
    finalizedBy verifyEclipseProductionClasspath
}

def prepareGameTestStructures = tasks.register('prepareGameTestStructures', Copy) {
    group = 'verification'
    description = 'Copies tracked SNBT fixtures into the GameTest working directory.'
    from layout.projectDirectory.dir('src/gametest/resources/gameteststructures')
    into layout.projectDirectory.dir(providerMergeRuntime
            ? "${providerMergeRunDirectory}/gameteststructures"
            : providerOverrideRuntime
            ? "${providerOverrideRunDirectory}/gameteststructures"
            : imcProviderRuntime
            ? "${imcProviderRunDirectory}/gameteststructures"
            : climateBoundaryRuntime
            ? "${climateBoundaryRunDirectory}/gameteststructures"
            : blankBiomeRuntime
            ? "${blankBiomeRunDirectory}/gameteststructures"
            : replaceModeRuntime
            ? "${replaceModeRunDirectory}/gameteststructures"
            : samplerPlatterRuntime
            ? "${samplerPlatterRunDirectory}/gameteststructures"
            : baseMetalsIntegration
            ? "${baseMetalsRunDirectory}/gameteststructures"
            : freshWorldgenIntegration
                    ? "${freshWorldgenRunDirectory}/gameteststructures"
                    : 'run/gameteststructures')
}

def prepareFreshWorldgenServer = tasks.register(
        'prepareFreshWorldgenServer', Copy) {
    group = 'verification'
    description = 'Installs the fixed-seed server properties for focused worldgen proof.'
    onlyIf { freshWorldgenIntegration }
    from layout.projectDirectory.file(
            'src/gametest/resources/fixed-worldgen-server.properties')
    into layout.projectDirectory.dir(baseMetalsIntegration
            ? baseMetalsRunDirectory
            : freshWorldgenRunDirectory)
    rename { 'server.properties' }
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures, prepareFreshWorldgenServer
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures, prepareFreshWorldgenServer
}
