def auditCakeWorldOreSpawnApiUsage = tasks.register(
        'auditCakeWorldOreSpawnApiUsage') {
    group = 'verification'
    description = 'Rejects deprecated or internal OreSpawn Java dependencies from packaged CakeWorld source.'
    inputs.files(fileTree('src/main/java') { include '**/*.java' })

    doLast {
        def violations = []
        fileTree('src/main/java') { include '**/*.java' }.files
                .sort { left, right -> left.path <=> right.path }
                .each { source ->
            source.eachLine('UTF-8') { line, number ->
                def trimmed = line.trim()
                if ((trimmed.startsWith(
                        'import zone.moddev.mc.orespawn.')
                        && !trimmed.startsWith(
                                'import zone.moddev.mc.orespawn.api.'))
                        || trimmed.startsWith(
                                'import zone.moddev.mc.orespawn.api.OreSpawnOreIntegration')
                        || trimmed.contains(
                                'WorldgenProvider.OilDefinition')) {
                    violations << "${source}:${number}: ${trimmed}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'CakeWorld crossed the current OreSpawn API boundary:\n'
                            + violations.join('\n'))
        }
    }
}

def auditCakeWorldThirdPartyIsolation = tasks.register(
        'auditCakeWorldThirdPartyIsolation') {
    group = 'verification'
    description = 'Rejects broad mob, structure, or resource mutation boundaries that could capture unknown mods.'
    inputs.files(fileTree('src/main/java/zone/moddev/mc/cakeworld/world') {
        include 'CakeWorld*Replacement.java'
        include '*Palette.java'
    })
    inputs.files('src/main/orespawn/provider.json',
            'src/main/orespawn/basemetals-overlay.json')

    doLast {
        def worldSources = fileTree(
                'src/main/java/zone/moddev/mc/cakeworld/world')
        def converters = worldSources.matching {
            include 'CakeWorld*Replacement.java'
        }.files.findAll { source ->
            source.getText('UTF-8').contains('EntityJoinWorldEvent')
        }
        if (converters.isEmpty()) {
            throw new GradleException(
                    'Third-party isolation audit found no entity converters.')
        }
        def broadConverters = converters.findAll { source ->
            !(source.getText('UTF-8') =~
                    /getType\(\)\s*!=\s*EntityType\./).find()
        }
        if (!broadConverters.isEmpty()) {
            throw new GradleException(
                    'Entity converters lost their exact literal-type guard:\n'
                            + broadConverters*.path.sort().join('\n'))
        }

        def palettes = worldSources.matching {
            include '*Palette.java'
        }.files.findAll { source ->
            source.getText('UTF-8').contains('ChunkEvent.Load')
        }
        if (palettes.isEmpty()) {
            throw new GradleException(
                    'Third-party isolation audit found no structure palettes.')
        }
        def broadPalettes = palettes.findAll { source ->
            def text = source.getText('UTF-8')
            !(text =~ /Registry\s*\.\s*CONFIGURED_STRUCTURE_FEATURE_REGISTRY/)
                    .find()
                    || !text.contains('getStartForFeature')
        }
        if (!broadPalettes.isEmpty()) {
            throw new GradleException(
                    'Structure palettes lost their exact configured-structure lookup:\n'
                            + broadPalettes*.path.sort().join('\n'))
        }

        def allowedNamespaces = [
                'minecraft', 'cakeworld', 'orespawn', 'basemetals'
        ] as Set
        def allowedScopeNamespaces = (allowedNamespaces
                + ['cakeworld_fixture']) as Set
        def resourceNamespaces = [] as Set
        def scopeNamespaces = [] as Set
        def walk
        walk = { node ->
            if (node instanceof Map) {
                node.each { key, value ->
                    def keyText = key.toString()
                    def keyMatch = keyText =~
                            /^#?([a-z0-9_.-]+):[a-z0-9_.\/-]+$/
                    if (keyMatch.matches()) {
                        resourceNamespaces << keyMatch.group(1)
                    }
                    if (keyText == 'include_namespaces'
                            || keyText == 'exclude_namespaces') {
                        def members = value instanceof Collection
                                ? value : [value]
                        members.findAll { it != null && !it.toString().isEmpty() }
                                .each { scopeNamespaces << it.toString() }
                    }
                    walk(value)
                }
            } else if (node instanceof Collection) {
                node.each { walk(it) }
            } else if (node instanceof String) {
                def match = node =~
                        /^#?([a-z0-9_.-]+):[a-z0-9_.\/-]+$/
                if (match.matches()) {
                    resourceNamespaces << match.group(1)
                }
            }
        }
        ['src/main/orespawn/provider.json',
                'src/main/orespawn/basemetals-overlay.json'].each { path ->
            walk(new groovy.json.JsonSlurper().parse(file(path)))
        }
        def unexpectedResources = resourceNamespaces - allowedNamespaces
        def unexpectedScopes = scopeNamespaces - allowedScopeNamespaces
        if (!unexpectedResources.isEmpty() || !unexpectedScopes.isEmpty()) {
            throw new GradleException(
                    'OreSpawn provider introduced an undeclared compatibility namespace: resources='
                            + unexpectedResources.sort()
                            + ', scopes=' + unexpectedScopes.sort())
        }
        logger.lifecycle(
                "Third-party isolation audit passed: ${converters.size()} exact entity converters, ${palettes.size()} exact structure palettes, resource namespaces ${resourceNamespaces.sort()}, scope namespaces ${scopeNamespaces.sort()}")
    }
}

def auditCakeWorldOriginalIdentity = tasks.register(
        'auditCakeWorldOriginalIdentity') {
    group = 'verification'
    description = 'Rejects distinctive story-IP names and reports the remaining original-art boundary.'
    inputs.files('README.md')
    inputs.files(fileTree('docs') { include '**/*.md' })
    inputs.files(fileTree('src/main/java') { include '**/*.java' })
    inputs.files(fileTree('src/main/resources') {
        include '**/*.json'
        include '**/*.mcmeta'
        include '**/*.toml'
    })

    doLast {
        def protectedFiles = [file('README.md')]
        protectedFiles.addAll(fileTree('docs') {
            include '**/*.md'
        }.files)
        protectedFiles.addAll(fileTree('src/main/java') {
            include '**/*.java'
        }.files)
        protectedFiles.addAll(fileTree('src/main/resources') {
            include '**/*.json'
            include '**/*.mcmeta'
            include '**/*.toml'
        }.files)

        def protectedPhrases = [
                'author name': ~/(?i)(?<![a-z0-9])roald[ -]+dahl(?![a-z0-9])/,
                'factory owner': ~/(?i)(?<![a-z0-9])(?:willy[ -]+)?wonka(?![a-z0-9])/,
                'factory workers': ~/(?i)(?<![a-z0-9])oompa[ -]+loompa(?![a-z0-9])/,
                'book title': ~/(?i)(?<![a-z0-9])charlie[ -]+(?:and[ -]+the[ -]+)?chocolate[ -]+factory(?![a-z0-9])/,
                'distinctive sweet': ~/(?i)(?<![a-z0-9])everlasting[ -]+gobstopper(?![a-z0-9])/,
                'distinctive invitation': ~/(?i)(?<![a-z0-9])golden[ -]+ticket(?![a-z0-9])/,
                'distinctive drink': ~/(?i)(?<![a-z0-9])fizzy[ -]+lifting[ -]+drink(?![a-z0-9])/,
                'distinctive berry': ~/(?i)(?<![a-z0-9])snozzberr(?:y|ies)(?![a-z0-9])/,
                'distinctive adjective': ~/(?i)(?<![a-z0-9])scrumdiddlyumptious(?![a-z0-9])/,
                'child character': ~/(?i)(?<![a-z0-9])(?:veruca[ -]+salt|violet[ -]+beauregarde|augustus[ -]+gloop|mike[ -]+teevee)(?![a-z0-9])/,
                'grandparent character': ~/(?i)(?<![a-z0-9])grandpa[ -]+joe(?![a-z0-9])/,
                'distinctive bar name': ~/(?i)(?<![a-z0-9])whipple[ -]+scrumptious(?![a-z0-9])/
        ]
        def violations = []
        protectedFiles.sort { left, right -> left.path <=> right.path }
                .each { source ->
            def text = source.getText('UTF-8')
            protectedPhrases.each { label, pattern ->
                def matcher = pattern.matcher(text)
                while (matcher.find()) {
                    def line = text.substring(0, matcher.start())
                            .count('\n') + 1
                    violations << "${source}:${line}: ${label}: ${matcher.group()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'CakeWorld introduced a protected story identity:\n'
                            + violations.join('\n'))
        }

        def language = new groovy.json.JsonSlurper().parse(
                file('src/main/resources/assets/cakeworld/lang/en_us.json'))
        def cakeWorldPngs = fileTree(
                'src/main/resources/assets/cakeworld') {
            include '**/*.png'
        }.files
        def minecraftTextureReferences = 0
        fileTree('src/main/resources/assets/cakeworld/models') {
            include '**/*.json'
        }.files.each { model ->
            def matcher = (model.getText('UTF-8') =~
                    /"(?:parent|layer[0-9]+|particle|up|down|north|south|east|west|side|top|bottom|all|end|texture)"\s*:\s*"minecraft:[a-z0-9_.\/-]+"/)
            minecraftTextureReferences += matcher.count
        }
        def deferredArtRows = file('docs/GAME_DESIGN.md')
                .readLines('UTF-8').count { line ->
            line =~ /(?i)(original (?:art|textures|presentation)|dedicated .* art|temporary vanilla|inherited renderer|vanilla texture)/
        }
        logger.lifecycle(
                "Original-identity audit passed: ${language.size()} English entries, zero protected story terms; current art boundary is ${cakeWorldPngs.size()} CakeWorld PNGs, ${minecraftTextureReferences} Minecraft model-texture references, and ${deferredArtRows} explicitly deferred design rows")
    }
}

