tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the deterministic CakeWorld release bundle.'
    dependsOn tasks.named('assemble'),
            tasks.named('verifyReleaseConfiguration')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = expectedReleaseFiles.get().collect { name ->
            File candidate = new File(libs, name)
            if (!candidate.isFile() || candidate.length() == 0) {
                throw new GradleException("Missing release artifact: ${candidate}")
            }
            candidate
        }
        Set<String> unexpected = (libs.listFiles() ?: [] as File[])
                .findAll { it.isFile() && it.name.endsWith('.jar')
                        && !expectedReleaseFiles.get().contains(it.name) }
                .collect { it.name } as Set<String>
        if (!unexpected.isEmpty()) {
            throw new GradleException("Unexpected release jars: ${unexpected}")
        }

        jars.each { jarFile ->
            ZipFile zip = new ZipFile(jarFile)
            try {
                Set<String> names = zip.entries().collect { it.name } as Set<String>
                Set<String> forbiddenNames = names.findAll { entry ->
                    String lower = entry.toLowerCase(Locale.ROOT)
                    lower.contains('agent-notes') || lower.contains('.codex')
                            || lower.contains('.claude') || lower.contains('.cursor')
                            || lower.contains('com/mcmoddev/cakeworld')
                            || lower == 'data/cakeworld/dimension/sampler_pantry.json'
                            || lower.endsWith('/orespawn.jar')
                            || (lower.contains('orespawn-') && lower.endsWith('.jar'))
                }
                if (!forbiddenNames.isEmpty()) {
                    throw new GradleException(
                            "Forbidden entries in ${jarFile.name}: ${forbiddenNames}")
                }
                zip.entries().each { entry ->
                    if (!entry.directory) {
                        byte[] bytes = zip.getInputStream(entry).bytes
                        String content = new String(bytes,
                                StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                        List<String> forbiddenContent = [
                                'com.mcmoddev.cakeworld',
                                'com/mcmoddev/cakeworld',
                                'agent-notes', '.codex', '.claude', '.cursor',
                                'c:' + ((char) 92) + 'users' + ((char) 92),
                                'd:' + ((char) 92) + 'cakeworld',
                                '/home/runner/'
                        ]
                        String match = forbiddenContent.find { content.contains(it) }
                        if (match != null) {
                            throw new GradleException(
                                    "${jarFile.name}!${entry.name} contains forbidden local context: ${match}")
                        }
                        if (entry.name.endsWith('.class') && bytes.length >= 8) {
                            int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                            if (major != 61) {
                                throw new GradleException(
                                        "${jarFile.name}!${entry.name} uses class version ${major}, expected 61")
                            }
                        }
                    }
                }
            } finally {
                zip.close()
            }
        }

        ZipFile main = new ZipFile(jars[0])
        try {
            Set<String> names = main.entries().collect { it.name } as Set<String>
            [
                    'META-INF/mods.toml',
                    'META-INF/LICENSE',
                    'zone/moddev/mc/cakeworld/CakeWorld.class',
                    'data/cakeworld/orespawn/provider.json'
            ].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException(
                            "Release jar is missing ${required}")
                }
            }
            String modsToml = main.getInputStream(
                    main.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!modsToml.contains('modId="cakeworld"')
                    || !modsToml.contains('version="0.2.0.118021"')
                    || !modsToml.contains('versionRange="[4.0.16.118021,5.0.0)"')) {
                throw new GradleException(
                        'Release metadata does not preserve CakeWorld and OreSpawn contracts')
            }
            def provider = new JsonSlurper().parseText(main.getInputStream(
                    main.getEntry('data/cakeworld/orespawn/provider.json'))
                    .getText('UTF-8'))
            if (provider.provider_revision != 59) {
                throw new GradleException(
                        "Expected OreSpawn provider revision 59, found ${provider.provider_revision}")
            }
        } finally {
            main.close()
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def output = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(output)
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File checksumFile = output.get().asFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText(expectedReleaseFiles.get().collect { name ->
            File candidate = new File(libs, name)
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0;
                        read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.sort().join('\n') + '\n', 'UTF-8')
    }
}

def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')
tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    onlyIf { preparedReleaseDir.isPresent() }
    doLast {
        File prepared = file(preparedReleaseDir.get())
        Set<String> expected = (expectedReleaseFiles.get()
                + ['SHA256SUMS', 'CHANGELOG.txt']) as Set<String>
        Set<String> actual = (prepared.listFiles() ?: [] as File[])
                .findAll { it.isFile() }.collect { it.name } as Set<String>
        if (actual != expected) {
            throw new GradleException(
                    "Prepared release files differ: expected ${expected}, found ${actual}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        List<String> actualChecksums = expectedReleaseFiles.get().collect { name ->
            File candidate = new File(prepared, name)
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0;
                        read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.sort()
        if (actualChecksums != checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.sort()) {
            throw new GradleException('Prepared release checksums do not match')
        }
    }
}

