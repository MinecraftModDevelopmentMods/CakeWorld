def prepareClimateBoundaryRun = tasks.register('prepareClimateBoundaryRun') {
    group = 'verification'
    description = 'Prepares an isolated all-range biome climate boundary proof.'
    dependsOn 'generateCakeWorldOreSpawnProvider'
    inputs.files(generatedOreSpawnProvider, samplerPlatterGlobalConfig,
            samplerPlatterServerProperties)
    outputs.upToDateWhen { false }

    doLast {
        def runRoot = climateBoundaryRunRoot.asFile
        def savedProfile = new File(runRoot,
                'world/serverconfig/orespawn-worldgen.json')
        if (savedProfile.isFile()) {
            throw new GradleException(
                    "Climate-boundary run directory already contains a saved world profile: ${savedProfile}. Use a new -PcakeworldClimateBoundaryRunDirectory value.")
        }

        def parser = new groovy.json.JsonSlurper()
        def packaged = parser.parse(
                generatedOreSpawnProvider.get().asFile) as Map
        def adventure = packaged.templates['cakeworld:edible_world'] as Map
        def productionProfile = adventure == null
                ? null : adventure.profile as Map
        def productionPalettes = productionProfile == null
                ? null : productionProfile.biome_palettes as Map
        if (productionPalettes == null) {
            throw new GradleException(
                    'Generated provider does not contain the adventure biome palettes.')
        }

        def ranges = [
                [-2.0D, 2.0D, 0.0D, 1.0D],
                [0.25D, 2.0D, 0.0D, 0.65D],
                [0.4D, 1.2D, 0.25D, 0.8D],
                [0.15D, 1.5D, 0.55D, 1.0D],
                [-2.0D, 0.3D, 0.35D, 1.0D],
                [0.7D, 2.0D, 0.7D, 1.0D],
                [0.5D, 1.2D, 0.75D, 1.0D],
                [1.5D, 2.0D, 0.0D, 0.2D],
                [-2.0D, 0.35D, 0.0D, 1.0D],
                [-2.0D, 0.2D, 0.0D, 0.8D],
                [0.5D, 2.0D, 0.0D, 0.35D],
                [0.3D, 1.2D, 0.35D, 1.0D],
                [0.4D, 1.0D, 0.6D, 1.0D],
                [0.3D, 1.0D, 0.4D, 0.9D],
                [0.5D, 1.2D, 0.2D, 0.6D],
                [-1.0D, 2.0D, 0.0D, 1.0D],
                [0.5D, 1.2D, 0.8D, 1.0D]
        ]
        def production = []
        productionPalettes.each { paletteId, paletteValue ->
            def palette = paletteValue as Map
            (palette.biomes as Map).each { outputId, placementValue ->
                def placement = placementValue as Map
                production << [
                        palette: paletteId,
                        output: outputId,
                        range: [
                                (placement.min_temperature as Number).doubleValue(),
                                (placement.max_temperature as Number).doubleValue(),
                                (placement.min_downfall as Number).doubleValue(),
                                (placement.max_downfall as Number).doubleValue()
                        ]
                ]
            }
        }
        if (production.size() != 35
                || production.collect { it.output }.toSet().size() != 35) {
            throw new GradleException(
                    "Expected 35 unique production biome outputs; got ${production.size()} rows and ${production.collect { it.output }.toSet().size()} IDs.")
        }

        def suffixes = [
                'minimum', 'maximum', 'temperature_below',
                'temperature_above', 'downfall_below', 'downfall_above'
        ]
        def assigned = []
        def testPalettes = new LinkedHashMap()
        ranges.eachWithIndex { range, index ->
            def matches = production.findAll { it.range == range }
            if (matches.isEmpty()) {
                throw new GradleException(
                        "No production biome uses climate range ${range}.")
            }
            assigned.addAll(matches.collect { it.output })
            def pathPrefix = String.format('range_%02d_', index)
            def requiredSources = suffixes.collect {
                "cakeworld_climate_fixture:${pathPrefix}${it}"
            }
            def output = matches[0].output
            testPalettes["cakeworld_fixture:climate_range_${String.format('%02d', index)}"] = [
                    dimension: 'minecraft:overworld',
                    enabled: true,
                    mode: 'replace',
                    scope: 'selected_namespaces',
                    region_size: 'tiny',
                    coverage: 1.0D,
                    fallback_weight: 0.0D,
                    include_namespaces: ['cakeworld_climate_fixture'],
                    exclude_namespaces: [],
                    biomes: [
                            (output): [
                                    enabled: true,
                                    weight: 1.0D,
                                    similar_biomes: requiredSources,
                                    required_similar_biomes: requiredSources,
                                    min_temperature: range[0],
                                    max_temperature: range[1],
                                    min_downfall: range[2],
                                    max_downfall: range[3]
                            ]
                    ]
            ]
        }
        if (assigned.size() != 35 || assigned.toSet().size() != 35) {
            throw new GradleException(
                    "The 17 expected climate ranges cover ${assigned.size()} rows and ${assigned.toSet().size()} unique outputs, not all 35.")
        }

        def provider = [
                schema_version: 4,
                provider_modid: 'cakeworld',
                provider_revision: 4701,
                templates: [
                        'cakeworld:climate_boundaries': [
                                name_key: 'template.cakeworld.climate_boundaries',
                                description_key: 'template.cakeworld.climate_boundaries.description',
                                required_mods: ['cakeworld'],
                                auto_select: false,
                                auto_select_priority: 0,
                                profile: [biome_palettes: testPalettes]
                        ]
                ]
        ]
        def configRoot = new File(runRoot, 'config')
        configRoot.mkdirs()
        def providerOverride = new File(configRoot, 'cakeworld-orespawn.json')
        providerOverride.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(provider))
                + System.lineSeparator(), 'UTF-8')

        def globalConfig = parser.parse(
                samplerPlatterGlobalConfig.asFile) as Map
        globalConfig.default_template = 'cakeworld:climate_boundaries'
        new File(configRoot, 'orespawn-worldgen.json').setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(globalConfig))
                        + System.lineSeparator(), 'UTF-8')
        copy {
            from samplerPlatterServerProperties
            into runRoot
            rename { 'server.properties' }
        }
        logger.lifecycle(
                "Prepared 17-range/35-output climate boundary provider: ${providerOverride}")
    }
}

def prepareProviderOverrideRun = tasks.register(
        'prepareProviderOverrideRun') {
    group = 'verification'
    description = 'Prepares an isolated provider-override precedence or fail-closed run.'
    inputs.files(providerOverrideValidFixture,
            providerOverrideMalformedFixture,
            providerOverrideSchema3Fixture,
            providerOverrideEqualPriorityFixture,
            samplerPlatterServerProperties)
    outputs.upToDateWhen { false }

    doLast {
        if (!(providerOverrideMode in ['valid', 'removed', 'malformed',
                'schema3', 'equal_priority'])) {
            throw new GradleException(
                    "cakeworldProviderOverrideMode must be valid, removed, malformed, schema3, or equal_priority; got '${providerOverrideMode}'.")
        }
        def runRoot = providerOverrideRunRoot.asFile
        def savedProfile = new File(runRoot,
                'world/serverconfig/orespawn-worldgen.json')
        def overrideFile = new File(runRoot,
                'config/cakeworld-orespawn.json')

        if (providerOverrideMode == 'removed') {
            if (!providerOverrideReuseWorld || !savedProfile.isFile()) {
                throw new GradleException(
                        'Removed-override evidence requires an existing saved profile and -PcakeworldProviderOverrideReuseWorld=true.')
            }
            if (overrideFile.isFile() && !overrideFile.delete()) {
                throw new GradleException(
                        "Could not remove isolated provider override fixture: ${overrideFile}")
            }
            logger.lifecycle(
                    "Removed isolated override fixture and retained world-owned profile: ${savedProfile}")
            return
        }

        if (savedProfile.isFile()
                && (providerOverrideMode in ['schema3', 'equal_priority'])
                && providerOverrideReuseWorld) {
            if (!overrideFile.isFile()) {
                throw new GradleException(
                        "Provider-override reload lost its authoritative fixture: ${overrideFile}")
            }
            logger.lifecycle(
                    "Reusing ${providerOverrideMode} fixture and world-owned profile: ${savedProfile}")
            return
        }
        if (savedProfile.isFile()) {
            throw new GradleException(
                    "Provider-override run directory already contains a saved world profile: ${savedProfile}. Use a new -PcakeworldProviderOverrideRunDirectory value, or use schema3/equal_priority with -PcakeworldProviderOverrideReuseWorld=true for reload proof.")
        }
        copy {
            from(providerOverrideMode == 'valid'
                    ? providerOverrideValidFixture
                    : providerOverrideMode == 'schema3'
                    ? providerOverrideSchema3Fixture
                    : providerOverrideMode == 'equal_priority'
                    ? providerOverrideEqualPriorityFixture
                    : providerOverrideMalformedFixture)
            into new File(runRoot, 'config')
            rename { 'cakeworld-orespawn.json' }
        }
        copy {
            from samplerPlatterServerProperties
            into runRoot
            rename { 'server.properties' }
        }
    }
}

def prepareProviderMergeRun = tasks.register('prepareProviderMergeRun') {
    group = 'verification'
    description = 'Prepares an isolated copied-world provider merge and tombstone phase.'
    inputs.files(providerMergeBaselineFixture, providerMergeUpgradeFixture,
            samplerPlatterServerProperties)
    outputs.upToDateWhen { false }

    doLast {
        if (!(providerMergePhase in ['baseline', 'upgrade', 'reload'])) {
            throw new GradleException(
                    "cakeworldProviderMergePhase must be baseline, upgrade, or reload; got '${providerMergePhase}'.")
        }
        def runRoot = providerMergeRunRoot.asFile
        def savedProfile = new File(runRoot,
                'world/serverconfig/orespawn-worldgen.json')
        def overrideFile = new File(runRoot,
                'config/cakeworld-orespawn.json')
        def mutationReceipt = new File(runRoot,
                'cakeworld-provider-merge-mutated.txt')

        if (providerMergePhase == 'baseline') {
            if (savedProfile.isFile()) {
                throw new GradleException(
                        "Provider-merge baseline requires a fresh run directory; found ${savedProfile}.")
            }
            copy {
                from providerMergeBaselineFixture
                into overrideFile.parentFile
                rename { 'cakeworld-orespawn.json' }
            }
        } else if (providerMergePhase == 'upgrade') {
            if (!savedProfile.isFile()) {
                throw new GradleException(
                        'Provider-merge upgrade requires the baseline world-owned profile.')
            }
            if (mutationReceipt.isFile()) {
                throw new GradleException(
                        "Provider-merge upgrade mutation was already applied: ${mutationReceipt}")
            }
            def parser = new groovy.json.JsonSlurper()
            def profile = parser.parse(savedProfile) as Map
            def manifest = (profile.providers as Map)?.cakeworld as Map
            if (manifest == null || manifest.provider_revision != 1701) {
                throw new GradleException(
                        'Provider-merge upgrade requires the revision-1701 baseline snapshot.')
            }
            def rocks = profile.rocks as Map
            def ores = profile.ores as Map
            def editedRock = rocks?.get('cakeworld:merge/edited_rock') as Map
            def editedOre = ores?.get('cakeworld:merge/edited_ore') as Map
            def disabledOre = ores?.get('cakeworld:merge/disabled_ore') as Map
            if (editedRock == null || editedOre == null
                    || disabledOre == null
                    || !ores.containsKey('cakeworld:merge/unassigned_ore')
                    || !ores.containsKey('cakeworld:merge/removed_ore')) {
                throw new GradleException(
                        'Revision-1701 snapshot is missing a provider-merge baseline rule.')
            }

            editedRock.weight = 7.25
            editedRock.player_note = 'keep-rock-edit'
            def editedDimensions = editedOre.dimensions as Map
            def editedOverworld = editedDimensions['minecraft:overworld'] as Map
            editedOverworld.frequency = 7.5
            editedOre.player_note = 'keep-ore-edit'
            disabledOre.enabled = false
            ores.remove('cakeworld:merge/unassigned_ore')
            ores['cakeworld:merge/player_custom_ore'] = [
                    block: 'cakeworld:fizzy_pearl',
                    enabled: false,
                    source_mod: 'cakeworld',
                    player_note: 'keep-custom-rule',
                    dimensions: [
                            'minecraft:overworld': [
                                    enabled: false,
                                    min_y: -16,
                                    max_y: 48,
                                    frequency: 0.25,
                                    quantity: 2,
                                    pattern: 'default',
                                    height_distribution: 'uniform',
                                    host_tags: ['minecraft:stone_ore_replaceables']
                            ]
                    ]
            ]
            def aliases = profile.worldgen_aliases as Map
            if (aliases == null) {
                aliases = [:]
                profile.worldgen_aliases = aliases
            }
            aliases['cakeworld:burnt_sugar_rock'] =
                    'cakeworld:sprinkle_cluster'
            savedProfile.setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(profile))
                    + System.lineSeparator(), 'UTF-8')
            mutationReceipt.setText(
                    'Applied CakeWorld copied-world edits before provider revision 1702.'
                    + System.lineSeparator(), 'UTF-8')
            copy {
                from providerMergeUpgradeFixture
                into overrideFile.parentFile
                rename { 'cakeworld-orespawn.json' }
            }
            logger.lifecycle(
                    "Applied isolated world-owned edits and installed provider revision 1702: ${savedProfile}")
        } else {
            if (!savedProfile.isFile() || !overrideFile.isFile()
                    || !mutationReceipt.isFile()) {
                throw new GradleException(
                        'Provider-merge reload requires the completed revision-1702 upgrade fixture.')
            }
            def profile = new groovy.json.JsonSlurper().parse(
                    savedProfile) as Map
            def manifest = (profile.providers as Map)?.cakeworld as Map
            if (manifest == null || manifest.provider_revision != 1702) {
                throw new GradleException(
                        'Provider-merge reload requires the revision-1702 world snapshot.')
            }
            logger.lifecycle(
                    "Reusing revision-1702 provider and world-owned snapshot unchanged: ${savedProfile}")
        }

        copy {
            from samplerPlatterServerProperties
            into runRoot
            rename { 'server.properties' }
        }
    }
}

def generateCakeWorldOreSpawnProvider =
        tasks.register('generateCakeWorldOreSpawnProvider') {
    group = 'build'
    description = 'Builds normal, shared-geology Sampler, and BaseMetals CakeWorld templates from one canonical profile.'
    inputs.files(canonicalOreSpawnProvider, baseMetalsOreSpawnOverlay)
    outputs.file(generatedOreSpawnProvider)

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def provider = parser.parse(canonicalOreSpawnProvider.asFile)
        def baseTemplate = provider.templates['cakeworld:edible_world']
        def compatibilityTemplate = parser.parseText(
                groovy.json.JsonOutput.toJson(baseTemplate))
        def compatibilityOverlay = parser.parse(baseMetalsOreSpawnOverlay.asFile)

        Closure merge
        merge = { Map target, Map overlay ->
            overlay.each { key, value ->
                if (value instanceof Map && target[key] instanceof Map) {
                    merge(target[key] as Map, value as Map)
                } else {
                    target[key] = value
                }
            }
        }
        merge(compatibilityTemplate as Map, compatibilityOverlay as Map)
        provider.templates['cakeworld:edible_world_basemetals'] =
                compatibilityTemplate

        def samplerTemplate =
                provider.templates['cakeworld:sampler_platter'] as Map
        def samplerProfile = samplerTemplate.profile as Map
        ['rocks', 'geomes', 'biomes', 'biome_dictionary',
                'terrain_dimensions'].each { section ->
            samplerProfile[section] = parser.parseText(
                    groovy.json.JsonOutput.toJson(
                            (baseTemplate.profile as Map)[section]))
        }

        def output = generatedOreSpawnProvider.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(provider)) + System.lineSeparator(),
                'UTF-8')
    }
}

