}

def restorePackagedProviderAfterImc = tasks.register(
        'restorePackagedProviderAfterImc') {
    group = 'verification'
    description = 'Restores the generated packaged provider after the isolated IMC runtime.'
    dependsOn 'generateCakeWorldOreSpawnProvider'
    outputs.upToDateWhen { false }

    doLast {
        def target = runtimePackagedProvider.get().asFile
        target.parentFile.mkdirs()
        copy {
            from generatedOreSpawnProvider
            into target.parentFile
            rename { 'provider.json' }
        }
        if (!target.isFile()) {
            throw new GradleException(
                    "Could not restore generated packaged provider: ${target}")
        }
        def testDimension = runtimeImcSamplerDimension.get().asFile
        if (testDimension.isFile() && !testDimension.delete()) {
            throw new GradleException(
                    "Could not remove test-only IMC dimension: ${testDimension}")
        }
        logger.lifecycle(
                "Restored generated packaged provider after IMC evidence: ${target}")
    }
}

