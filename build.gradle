plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "CakeWorld-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
def baseMetalsIntegration = providers.gradleProperty('cakeworldBaseMetalsRuntime')
        .map { it.toBoolean() }.getOrElse(false)
def baseMetalsRunDirectory = providers.gradleProperty(
        'cakeworldBaseMetalsRunDirectory').getOrElse('run-basemetals')
def freshWorldgenIntegration = providers.gradleProperty(
        'cakeworldFreshWorldgenRuntime').map { it.toBoolean() }.getOrElse(false)
def freshWorldgenRunDirectory = providers.gradleProperty(
        'cakeworldFreshWorldgenRunDirectory')
        .getOrElse('run-fresh-worldgen-current')
def samplerThirdPartyRuntime = providers.gradleProperty(
        'cakeworldSamplerThirdPartyRuntime')
        .map { it.toBoolean() }.getOrElse(false)
def samplerPlatterRuntime = providers.gradleProperty(
        'cakeworldSamplerRuntime').map { it.toBoolean() }.getOrElse(false)
        || samplerThirdPartyRuntime
def samplerPlatterRunDirectory = providers.gradleProperty(
        'cakeworldSamplerRunDirectory').getOrElse('run-sampler-platter')
def samplerPlatterReuseWorld = providers.gradleProperty(
        'cakeworldSamplerReuseWorld').map { it.toBoolean() }.getOrElse(false)
def samplerRetrogenPhase = providers.gradleProperty(
        'cakeworldSamplerRetrogenPhase').orNull
def samplerFormationCase = providers.gradleProperty(
        'cakeworldSamplerFormationCase').orNull
def providerOverrideMode = providers.gradleProperty(
        'cakeworldProviderOverrideMode').orNull
def providerOverrideRuntime = providerOverrideMode != null
def providerOverrideRunDirectory = providers.gradleProperty(
        'cakeworldProviderOverrideRunDirectory')
        .getOrElse('run-provider-override')
def providerOverrideReuseWorld = providers.gradleProperty(
        'cakeworldProviderOverrideReuseWorld')
        .map { it.toBoolean() }.getOrElse(false)
def imcProviderRuntime = providers.gradleProperty(
        'cakeworldImcProviderRuntime').map { it.toBoolean() }.getOrElse(false)
def imcProviderRunDirectory = providers.gradleProperty(
        'cakeworldImcProviderRunDirectory').getOrElse('run-imc-provider')
def cakeworldGameTestNamespaces = providers.gradleProperty(
        'cakeworldGameTestNamespaces').getOrElse(
        providerOverrideRuntime
                ? 'cakeworld_provider_override'
                : imcProviderRuntime
                        ? 'cakeworld_imc_provider'
                : samplerThirdPartyRuntime
                        ? 'cakeworld_sampler_third_party'
                : samplerPlatterRuntime ? 'cakeworld_sampler' : mod_id)
def expectedFormationAlgorithm = providers.gradleProperty(
        'cakeworldExpectedFormationAlgorithm').orNull
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://github.com/ParchmentMC/Parchment/wiki/Getting-Started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (baseMetalsIntegration) {
                workingDirectory project.file('run-basemetals-client')
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            if (providerOverrideRuntime) {
                workingDirectory project.file(providerOverrideRunDirectory)
            } else if (imcProviderRuntime) {
                workingDirectory project.file(imcProviderRunDirectory)
            } else if (samplerPlatterRuntime) {
                workingDirectory project.file(samplerPlatterRunDirectory)
            } else if (baseMetalsIntegration) {
                workingDirectory project.file(baseMetalsRunDirectory)
            } else if (freshWorldgenIntegration) {
                workingDirectory project.file(freshWorldgenRunDirectory)
            }
            property 'forge.enabledGameTestNamespaces',
                    cakeworldGameTestNamespaces
            if (samplerPlatterRuntime) {
                property 'cakeworld.samplerPlatterEvidence', 'true'
            }
            if (samplerRetrogenPhase != null) {
                property 'cakeworld.samplerRetrogenPhase',
                        samplerRetrogenPhase
            }
            if (samplerFormationCase != null) {
                property 'cakeworld.samplerFormationCase',
                        samplerFormationCase
            }
            if (samplerThirdPartyRuntime) {
                property 'cakeworld.samplerThirdPartyFixture', 'true'
            }
            if (providerOverrideRuntime) {
                property 'cakeworld.providerOverrideMode',
                        providerOverrideMode
            }
            if (imcProviderRuntime) {
                property 'cakeworld.imcProviderFixture', 'true'
            }
            if (freshWorldgenIntegration) {
                property 'cakeworld.fixedWorldgenEvidence', 'true'
            }
            if (expectedFormationAlgorithm != null) {
                property 'cakeworld.expectedFormationAlgorithm',
                        expectedFormationAlgorithm
            }
            if (providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
                property 'orespawn.worldgenBenchmarkMode',
                        providers.gradleProperty('orespawnBenchmarkMode').get()
                property 'orespawn.worldgenBenchmarkRadius',
                        providers.gradleProperty('orespawnBenchmarkRadius').getOrElse('4')
                property 'orespawn.worldgenBenchmarkRepetitions',
                        providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse('3')
                property 'orespawn.worldgenBenchmarkDimension',
                        providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
                property 'orespawn.worldgenBenchmarkCenterX',
                        providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse('256')
                property 'orespawn.worldgenBenchmarkCenterZ',
                        providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse('256')
                property 'orespawn.worldgenBenchmarkCenterStep',
                        providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
                property 'orespawn.worldgenBenchmarkStopServer', 'true'
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def canonicalOreSpawnProvider =
        layout.projectDirectory.file('src/main/orespawn/provider.json')
def baseMetalsOreSpawnOverlay =
        layout.projectDirectory.file('src/main/orespawn/basemetals-overlay.json')
def generatedOreSpawnResources =
        layout.buildDirectory.dir('generated/cakeworldResources')
def generatedOreSpawnProvider = generatedOreSpawnResources.map {
    it.file('data/cakeworld/orespawn/provider.json')
}
def samplerPlatterGlobalConfig =
        layout.projectDirectory.file(
                'src/test/orespawn/sampler-platter-global.json')
def samplerPlatterServerProperties =
        layout.projectDirectory.file(
                'src/test/orespawn/sampler-platter-server.properties')
def samplerPlatterRunRoot =
        layout.projectDirectory.dir(samplerPlatterRunDirectory)
def providerOverrideValidFixture =
        layout.projectDirectory.file(
                'src/test/orespawn/provider-override-valid.json')
def providerOverrideMalformedFixture =
        layout.projectDirectory.file(
                'src/test/orespawn/provider-override-malformed.txt')
def providerOverrideSchema3Fixture =
        layout.projectDirectory.file(
                'src/test/orespawn/provider-override-schema3.json')
def providerOverrideRunRoot =
        layout.projectDirectory.dir(providerOverrideRunDirectory)
def imcProviderRunRoot =
        layout.projectDirectory.dir(imcProviderRunDirectory)
def runtimePackagedProvider = layout.buildDirectory.file(
        'resources/main/data/cakeworld/orespawn/provider.json')
def imcSamplerDimensionFixture = layout.projectDirectory.file(
        'src/test/orespawn/imc-sampler-dimension.json')
def runtimeImcSamplerDimension = layout.buildDirectory.file(
        'resources/main/data/cakeworld/dimension/sampler_pantry.json')

def prepareSamplerPlatterRun = tasks.register('prepareSamplerPlatterRun') {
    group = 'verification'
    description = 'Prepares a fresh, explicitly selected Sampler Platter GameTest run.'
    dependsOn 'generateCakeWorldOreSpawnProvider'
    inputs.files(samplerPlatterGlobalConfig, samplerPlatterServerProperties,
            generatedOreSpawnProvider)
    outputs.files(
            samplerPlatterRunRoot.file('config/orespawn-worldgen.json'),
            samplerPlatterRunRoot.file('server.properties'))
    outputs.upToDateWhen { false }

    doLast {
        def runRoot = samplerPlatterRunRoot.asFile
        def savedProfile = new File(runRoot,
                'world/serverconfig/orespawn-worldgen.json')
        def formationCase = samplerFormationCase == null
                ? 'extreme' : samplerFormationCase
        if (!(formationCase in ['extreme', 'minimum'])) {
            throw new GradleException(
                    "cakeworldSamplerFormationCase must be extreme or minimum; got '${formationCase}'.")
        }
        if (samplerRetrogenPhase != null
                && !(samplerRetrogenPhase in ['baseline', 'apply', 'reload'])) {
            throw new GradleException(
                    "cakeworldSamplerRetrogenPhase must be baseline, apply, or reload; got '${samplerRetrogenPhase}'.")
        }
        if (samplerRetrogenPhase == 'reload'
                && (!samplerPlatterReuseWorld || !savedProfile.isFile())) {
            throw new GradleException(
                    'Sampler retrogen reload requires an existing saved profile and -PcakeworldSamplerReuseWorld=true.')
        }
        if (samplerRetrogenPhase == 'apply') {
            if (!samplerPlatterReuseWorld || !savedProfile.isFile()) {
                throw new GradleException(
                        'Sampler retrogen apply requires an existing saved profile and -PcakeworldSamplerReuseWorld=true.')
            }
            def parser = new groovy.json.JsonSlurper()
            def profile = parser.parse(savedProfile) as Map
            def ores = profile.ores as Map
            def sprinkle = ores == null
                    ? null : ores['cakeworld:ore/retrogen_sprinkles']
            def control = ores == null
                    ? null : ores['cakeworld:ore/retrogen_control']
            if (!(sprinkle instanceof Map) || !(control instanceof Map)) {
                throw new GradleException(
                        'Saved Sampler profile does not contain both disabled retrogen fixtures.')
            }
            sprinkle.enabled = true
            control.enabled = true
            profile.retrogen = [
                    enabled: true,
                    force: false,
                    revision: 5301,
                    chunks_per_tick: 4
            ]
            savedProfile.setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(profile))
                    + System.lineSeparator(), 'UTF-8')
            logger.lifecycle(
                    "Enabled bounded retrogen revision 5301 only in copied Sampler profile: ${savedProfile}")
            return
        }
        if (savedProfile.isFile() && !samplerPlatterReuseWorld) {
            throw new GradleException(
                    "Sampler run directory already contains a saved world profile: ${savedProfile}. Use a new -PcakeworldSamplerRunDirectory value, or explicitly pass -PcakeworldSamplerReuseWorld=true for reload evidence.")
        }
        if (savedProfile.isFile()) {
            logger.lifecycle(
                    "Reusing Sampler world-owned profile without rewriting its global selection fixture: ${savedProfile}")
            return
        }
        def providerOverride = new File(runRoot,
                'config/cakeworld-orespawn.json')
        if (formationCase == 'minimum') {
            def parser = new groovy.json.JsonSlurper()
            def provider = parser.parse(
                    generatedOreSpawnProvider.get().asFile) as Map
            def sampler = provider.templates['cakeworld:sampler_platter'] as Map
            def profile = sampler == null ? null : sampler.profile as Map
            if (profile == null) {
                throw new GradleException(
                        'Generated provider does not contain the Sampler profile.')
            }
            profile.formations = [
                    algorithm: 'sky_v1',
                    horizontal_size: 'tiny',
                    vertical_thickness: 'tiny',
                    waviness: 'tiny',
                    edge_irregularity: 'tiny',
                    formation_continuity: 'tiny',
                    custom: [:]
            ]
            providerOverride.parentFile.mkdirs()
            providerOverride.setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(provider))
                    + System.lineSeparator(), 'UTF-8')
            logger.lifecycle(
                    "Prepared minimum-preset Sampler provider override: ${providerOverride}")
        } else if (providerOverride.isFile()
                && !providerOverride.delete()) {
            throw new GradleException(
                    "Could not remove stale Sampler provider override: ${providerOverride}")
        }
        copy {
            from samplerPlatterGlobalConfig
            into new File(runRoot, 'config')
            rename { 'orespawn-worldgen.json' }
        }
        copy {
            from samplerPlatterServerProperties
            into runRoot
            rename { 'server.properties' }
        }
    }
}

def prepareProviderOverrideRun = tasks.register(
        'prepareProviderOverrideRun') {
    group = 'verification'
    description = 'Prepares an isolated provider-override precedence or fail-closed run.'
    inputs.files(providerOverrideValidFixture,
            providerOverrideMalformedFixture,
            providerOverrideSchema3Fixture,
            samplerPlatterServerProperties)
    outputs.upToDateWhen { false }

    doLast {
        if (!(providerOverrideMode in ['valid', 'removed', 'malformed',
                'schema3'])) {
            throw new GradleException(
                    "cakeworldProviderOverrideMode must be valid, removed, malformed, or schema3; got '${providerOverrideMode}'.")
        }
        def runRoot = providerOverrideRunRoot.asFile
        def savedProfile = new File(runRoot,
                'world/serverconfig/orespawn-worldgen.json')
        def overrideFile = new File(runRoot,
                'config/cakeworld-orespawn.json')

        if (providerOverrideMode == 'removed') {
            if (!providerOverrideReuseWorld || !savedProfile.isFile()) {
                throw new GradleException(
                        'Removed-override evidence requires an existing saved profile and -PcakeworldProviderOverrideReuseWorld=true.')
            }
            if (overrideFile.isFile() && !overrideFile.delete()) {
                throw new GradleException(
                        "Could not remove isolated provider override fixture: ${overrideFile}")
            }
            logger.lifecycle(
                    "Removed isolated override fixture and retained world-owned profile: ${savedProfile}")
            return
        }

        if (savedProfile.isFile() && providerOverrideMode == 'schema3'
                && providerOverrideReuseWorld) {
            if (!overrideFile.isFile()) {
                throw new GradleException(
                        "Schema-3 reload lost its authoritative fixture: ${overrideFile}")
            }
            logger.lifecycle(
                    "Reusing schema-3 fixture and world-owned migrated profile: ${savedProfile}")
            return
        }
        if (savedProfile.isFile()) {
            throw new GradleException(
                    "Provider-override run directory already contains a saved world profile: ${savedProfile}. Use a new -PcakeworldProviderOverrideRunDirectory value, or use schema3 with -PcakeworldProviderOverrideReuseWorld=true for its reload proof.")
        }
        copy {
            from(providerOverrideMode == 'valid'
                    ? providerOverrideValidFixture
                    : providerOverrideMode == 'schema3'
                    ? providerOverrideSchema3Fixture
                    : providerOverrideMalformedFixture)
            into new File(runRoot, 'config')
            rename { 'cakeworld-orespawn.json' }
        }
        copy {
            from samplerPlatterServerProperties
            into runRoot
            rename { 'server.properties' }
        }
    }
}

def generateCakeWorldOreSpawnProvider =
        tasks.register('generateCakeWorldOreSpawnProvider') {
    group = 'build'
    description = 'Builds normal, shared-geology Sampler, and BaseMetals CakeWorld templates from one canonical profile.'
    inputs.files(canonicalOreSpawnProvider, baseMetalsOreSpawnOverlay)
    outputs.file(generatedOreSpawnProvider)

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def provider = parser.parse(canonicalOreSpawnProvider.asFile)
        def baseTemplate = provider.templates['cakeworld:edible_world']
        def compatibilityTemplate = parser.parseText(
                groovy.json.JsonOutput.toJson(baseTemplate))
        def compatibilityOverlay = parser.parse(baseMetalsOreSpawnOverlay.asFile)

        Closure merge
        merge = { Map target, Map overlay ->
            overlay.each { key, value ->
                if (value instanceof Map && target[key] instanceof Map) {
                    merge(target[key] as Map, value as Map)
                } else {
                    target[key] = value
                }
            }
        }
        merge(compatibilityTemplate as Map, compatibilityOverlay as Map)
        provider.templates['cakeworld:edible_world_basemetals'] =
                compatibilityTemplate

        def samplerTemplate =
                provider.templates['cakeworld:sampler_platter'] as Map
        def samplerProfile = samplerTemplate.profile as Map
        ['rocks', 'geomes', 'biomes', 'biome_dictionary',
                'terrain_dimensions'].each { section ->
            samplerProfile[section] = parser.parseText(
                    groovy.json.JsonOutput.toJson(
                            (baseTemplate.profile as Map)[section]))
        }

        def output = generatedOreSpawnProvider.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(provider)) + System.lineSeparator(),
                'UTF-8')
    }
}

sourceSets.main.resources { srcDir generatedOreSpawnResources }

def prepareImcProviderRun = tasks.register('prepareImcProviderRun') {
    group = 'verification'
    description = 'Isolates the packaged provider so a conditional Forge IMC provider is authoritative.'
    dependsOn 'processResources'
    inputs.files(generatedOreSpawnProvider, samplerPlatterServerProperties,
            imcSamplerDimensionFixture)
    outputs.upToDateWhen { false }

    doLast {
        def runRoot = imcProviderRunRoot.asFile
        def savedProfile = new File(runRoot,
                'world/serverconfig/orespawn-worldgen.json')
        if (savedProfile.isFile()) {
            throw new GradleException(
                    "IMC provider run directory already contains a saved world profile: ${savedProfile}. Use a new -PcakeworldImcProviderRunDirectory value.")
        }
        def runtimeProvider = runtimePackagedProvider.get().asFile
        if (!runtimeProvider.isFile() || !runtimeProvider.delete()) {
            throw new GradleException(
                    "Could not isolate the generated packaged provider: ${runtimeProvider}")
        }
        copy {
            from imcSamplerDimensionFixture
            into runtimeImcSamplerDimension.get().asFile.parentFile
            rename { 'sampler_pantry.json' }
        }
        if (!runtimeImcSamplerDimension.get().asFile.isFile()) {
            throw new GradleException(
                    "Could not install test-only IMC dimension: ${runtimeImcSamplerDimension.get().asFile}")
        }
        copy {
            from samplerPlatterServerProperties
            into runRoot
            rename { 'server.properties' }
        }
        logger.lifecycle(
                "Removed only the build-output provider for isolated IMC evidence: ${runtimeProvider}")
    }
}

def restorePackagedProviderAfterImc = tasks.register(
        'restorePackagedProviderAfterImc') {
    group = 'verification'
    description = 'Restores the generated packaged provider after the isolated IMC runtime.'
    dependsOn 'generateCakeWorldOreSpawnProvider'
    outputs.upToDateWhen { false }

    doLast {
        def target = runtimePackagedProvider.get().asFile
        target.parentFile.mkdirs()
        copy {
            from generatedOreSpawnProvider
            into target.parentFile
            rename { 'provider.json' }
        }
        if (!target.isFile()) {
            throw new GradleException(
                    "Could not restore generated packaged provider: ${target}")
        }
        def testDimension = runtimeImcSamplerDimension.get().asFile
        if (testDimension.isFile() && !testDimension.delete()) {
            throw new GradleException(
                    "Could not remove test-only IMC dimension: ${testDimension}")
        }
        logger.lifecycle(
                "Restored generated packaged provider after IMC evidence: ${target}")
    }
}

tasks.configureEach {
    if (samplerPlatterRuntime && name == 'runGameTestServer') {
        dependsOn prepareSamplerPlatterRun
    }
    if (providerOverrideRuntime && name == 'runGameTestServer') {
        dependsOn prepareProviderOverrideRun
    }
    if (imcProviderRuntime && name == 'runGameTestServer') {
        dependsOn prepareImcProviderRun
        finalizedBy restorePackagedProviderAfterImc
    }
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    flatDir {
        dir file('../../../BaseMetals/BaseMetals 118/BaseMetals/build/libs')
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(
            "curse.maven:mmd-orespawn-${orespawn_curseforge_project_id}:${orespawn_curseforge_file_id}")
    if (baseMetalsIntegration) {
        def baseMetalsJar = rootProject.file(
                '../../../BaseMetals/BaseMetals 118/BaseMetals/build/libs/BaseMetals-1.18.2-3.0.0.jar')
        if (!baseMetalsJar.isFile()) {
            throw new GradleException(
                    "BaseMetals integration requested but ${baseMetalsJar} does not exist")
        }
        runtimeOnly fg.deobf("local:BaseMetals-${minecraft_version}:3.0.0")
    }

    // Real mod deobf dependency examples - these get remapped to your current mappings
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}:api") // Adds JEI API as a compile dependency
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}") // Adds the full JEI mod as a runtime dependency
    // implementation fg.deobf("com.tterrag.registrate:Registrate:MC${mc_version}-${registrate_version}") // Adds registrate as a dependency

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

eclipse {
    project {
        name = 'CakeWorld'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    dependsOn generateCakeWorldOreSpawnProvider
    // Local agent context is deliberately ignored by Git and must never be
    // copied into development resources or a public mod artifact.
    exclude '**/AGENTS.md', '**/agent-notes/**', '**/.codex/**'
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // The CurseForge artifact is distributed on its own, so carry the exact
    // project license inside the JAR as well as declaring it in mods.toml.
    from(layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
    // Defence in depth for stale or externally generated resource outputs.
    exclude '**/AGENTS.md', '**/agent-notes/**', '**/.codex/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

def auditCakeWorldOreSpawnApiUsage = tasks.register(
        'auditCakeWorldOreSpawnApiUsage') {
    group = 'verification'
    description = 'Rejects deprecated or internal OreSpawn Java dependencies from packaged CakeWorld source.'
    inputs.files(fileTree('src/main/java') { include '**/*.java' })

    doLast {
        def violations = []
        fileTree('src/main/java') { include '**/*.java' }.files
                .sort { left, right -> left.path <=> right.path }
                .each { source ->
            source.eachLine('UTF-8') { line, number ->
                def trimmed = line.trim()
                if ((trimmed.startsWith(
                        'import zone.moddev.mc.orespawn.')
                        && !trimmed.startsWith(
                                'import zone.moddev.mc.orespawn.api.'))
                        || trimmed.startsWith(
                                'import zone.moddev.mc.orespawn.api.OreSpawnOreIntegration')
                        || trimmed.contains(
                                'WorldgenProvider.OilDefinition')) {
                    violations << "${source}:${number}: ${trimmed}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'CakeWorld crossed the current OreSpawn API boundary:\n'
                            + violations.join('\n'))
        }
    }
}

tasks.named('check').configure {
    dependsOn auditCakeWorldOreSpawnApiUsage
}

def prepareGameTestStructures = tasks.register('prepareGameTestStructures', Copy) {
    group = 'verification'
    description = 'Copies tracked SNBT fixtures into the GameTest working directory.'
    from layout.projectDirectory.dir('src/gametest/resources/gameteststructures')
    into layout.projectDirectory.dir(providerOverrideRuntime
            ? "${providerOverrideRunDirectory}/gameteststructures"
            : imcProviderRuntime
            ? "${imcProviderRunDirectory}/gameteststructures"
            : samplerPlatterRuntime
            ? "${samplerPlatterRunDirectory}/gameteststructures"
            : baseMetalsIntegration
            ? "${baseMetalsRunDirectory}/gameteststructures"
            : freshWorldgenIntegration
                    ? "${freshWorldgenRunDirectory}/gameteststructures"
                    : 'run/gameteststructures')
}

def prepareFreshWorldgenServer = tasks.register(
        'prepareFreshWorldgenServer', Copy) {
    group = 'verification'
    description = 'Installs the fixed-seed server properties for focused worldgen proof.'
    onlyIf { freshWorldgenIntegration }
    from layout.projectDirectory.file(
            'src/gametest/resources/fixed-worldgen-server.properties')
    into layout.projectDirectory.dir(baseMetalsIntegration
            ? baseMetalsRunDirectory
            : freshWorldgenRunDirectory)
    rename { 'server.properties' }
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures, prepareFreshWorldgenServer
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures, prepareFreshWorldgenServer
}
