def mavenizerCompatibilityJar = layout.projectDirectory.file(
        'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-1.18.jar')
def mavenizerCompatibilitySha256 =
        '28A6697BDF6D9500EC0AF9C1C949B9F3ED7DDFDA649CB5CAC4BEEA2E9567570A'

// ForgeGradle 7's Mavenizer recompilation rejects a redundant accessor emitted
// by Forge 40's 1.18.2 decompiler. This checksum-sealed build-only variant
// removes that accessor; CakeWorld and every shipped class remain Java 17.
fgtools.configure('mavenizer') {
    classpath.from(mavenizerCompatibilityJar)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'CakeWorld'
}

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException(
            "mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
def minecraftPatch = minecraftVersionParts.size() == 3
        ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}
ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version
def expectedMavenGroup = 'zone.moddev.mc.cakeworld'
def expectedMavenArtifact = 'CakeWorld'
def expectedMavenCoordinate =
