tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    if (['runClient', 'runServer', 'runGameTestServer', 'runData']
            .contains(runTask.name)) {
        runTask.dependsOn prepareForgeRunModClasses
        // Forge 40 resolves one complete exploded mod more reliably than
        // separate class and resource roots under ForgeGradle 7.
        runTask.environment 'MOD_CLASSES',
                "${mod_id}%%${forgeRunModClassesDirectory}"
    }
}

